[package]
name = "kllm"
version = "0.1.0"
edition = "2024"
description = "Memory-first LLM inference for constrained and legacy hardware"
license = "Apache-2.0 OR MIT"

[lib]
name = "kllm"
path = "src/lib.rs"

[[bin]]
name = "kllm"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dependencies]
fancy-regex = "0.20.2"
memmap2 = "0.9.12"

[dev-dependencies]
serde_json = "1.0.154"


# The test-suite runs real models; unoptimised kernels would take minutes.
[profile.test]
opt-level = 3
